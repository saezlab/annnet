[bumpversion]
current_version = 0.2.0
commit = True
tag = True
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)
serialize = {major}.{minor}.{patch}

# pyproject.toml is the only file that carries the version. ``annnet.__version__``
# reads it from there, and falls back to the installed package metadata, so
# nothing in the package repeats the number.
#
# The search and replace are scoped to the assignment on purpose. The bare
# ``files = pyproject.toml`` form the sibling packages use replaces every
# occurrence of the version string in the file, and ``0.2.0`` is a substring of
# the ``codecov-cli>=10.2.0`` pin four dozen lines above it. That form turns the
# pin into ``>=10.3.0`` on a minor bump, silently.
[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"
