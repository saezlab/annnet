site_name: 'annnet'
site_url: https://annnet.sysbioverse.org/
repo_url: https://github.com/saezlab/annnet
repo_name: saezlab/annnet
exclude_docs: |
    changelog.md
    tutorials/**
theme:
    name: material
    custom_dir: overrides
    favicon: assets/favicon.ico
    font:
        text: Lato
        code: Roboto Mono
    features:
    -   content.code.copy
    -   content.action.edit
    -   navigation.tabs
    -   navigation.footer
    palette:
    -   scheme: default
        primary: custom
        accent: custom
        toggle:
            icon: material/toggle-switch
            name: Switch to dark mode
    -   scheme: slate
        primary: custom
        accent: custom
        toggle:
            icon: material/toggle-switch-off
            name: Switch to light mode

