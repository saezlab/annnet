name: Security Scan

on: [push, pull_request]

jobs:
    security-check:
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v4
        -   uses: actions/setup-python@v5
            with:
                python-version: '3.12'
        -   name: Install Bandit
            run: pip install bandit
        -   name: Run Bandit
            # Exclusions must be written as ./name: bandit turns a directory
            # into the glob `<path>/*` and matches it against the paths it
            # walked from the target `.`, so a bare `tests` never matches
            # `./tests/...`.
            run: bandit -r . --exclude ./tests,./venv,./.venv,./.tox,./pixi,./.pixi,./benchmarks --skip B101,B110,B112,B311
